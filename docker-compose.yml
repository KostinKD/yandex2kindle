services:
  yandex2kindle:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./incoming:/incoming
    environment:
      - LIBRARY_DIR=/data/calibre
      - DATABASE_PATH=/data/app.db
      - INCOMING_DIR=/incoming
      - APP_HOST_IP=${HOST_IP:-}
      - APP_HOST_PORT=${APP_PORT:-8000}
      - KINDLE_EMAIL=${KINDLE_EMAIL:-}
      - YANDEX_BOOK_TOKEN=${YANDEX_BOOK_TOKEN:-}
      - YANDEX_SYNC_INTERVAL_SECONDS=${YANDEX_SYNC_INTERVAL_SECONDS:-0}
      - FLIBUSTA_SEARCH_URL=${FLIBUSTA_SEARCH_URL:-}
      - ZLIB_REMIX_USERID=${ZLIB_REMIX_USERID:-}
      - ZLIB_REMIX_USERKEY=${ZLIB_REMIX_USERKEY:-}
      - OPDS_SEARCH_URL=${OPDS_SEARCH_URL:-}
      - REMOTE_ALLOWED_ORIGINS=${REMOTE_ALLOWED_ORIGINS:-}
      - REMOTE_DOWNLOAD_TIMEOUT_SECONDS=${REMOTE_DOWNLOAD_TIMEOUT_SECONDS:-600}
      - REMOTE_CONNECT_TIMEOUT_SECONDS=${REMOTE_CONNECT_TIMEOUT_SECONDS:-60}
      - REMOTE_TRUST_ENV=${REMOTE_TRUST_ENV:-true}
      - REMOTE_USER_AGENT=${REMOTE_USER_AGENT:-}
      - REMOTE_HTTP2=${REMOTE_HTTP2:-true}
      - REMOTE_BOOK_SESSION=${REMOTE_BOOK_SESSION:-true}
      - KOSYNC_LIBRARY_USER=${KOSYNC_LIBRARY_USER:-reader}
      - KOSYNC_ALLOW_REGISTRATION=${KOSYNC_ALLOW_REGISTRATION:-true}
      - READING_TIMEZONE=${READING_TIMEZONE:-Europe/Moscow}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      - INCOMING_WATCH_INTERVAL_SECONDS=${INCOMING_WATCH_INTERVAL_SECONDS:-3}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - TELEGRAM_AUTO_SEND_TO_KINDLE=${TELEGRAM_AUTO_SEND_TO_KINDLE:-false}
    restart: unless-stopped
