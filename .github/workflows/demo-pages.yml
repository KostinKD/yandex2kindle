name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - 'app/static/app.css'
      - 'app/static/workspace.css'
      - 'app/static/favicon.svg'
      - 'scripts/build_demo.py'
      - 'tests/test_demo_build.py'
      - '.github/workflows/demo-pages.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public artifact boundaries
        run: python -m unittest discover -s tests -p test_demo_build.py -v
      - name: Build static demo
        run: python scripts/build_demo.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
